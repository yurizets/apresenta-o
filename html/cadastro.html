<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #4a88da;">

    <form action="cadastro2.php" method="post" autocomplete="off">
        <h1>Cadastro</h1>

    <p>
    <label for="nomec">Nome completo</label>
    <input type="text" name="nome" id="nomec" placeholder="Ex: João Silva" required>
    </p>

        <p>
            <label for="emailu">Email</label>
            <input type="email" name="email" id="emailu" title="Digite um email válido" pattern=".+@.+\.com(\.br)?" required>
        </p>

        <p>
            <label for="senhau">Senha</label>
            <input type="password" name="senha" id="senhau" minlength="8" required>
        </p>

        <p><input type="submit" value="Cadastrar"></p>
        <div class="container">
        <p style="text-align: center;">Já tem uma conta? <a href="entrar.html">Entrar</a></p>
    </form>
<script src="script.js"></script>
</body>
</html>
